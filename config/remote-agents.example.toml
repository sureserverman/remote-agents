[paths]
dev_root = "/home/user/dev"
registry_path = "/home/user/.claude/projects-registry.yaml"
database_path = "/home/user/.local/state/remote-agents/sessions.sqlite3"

[limits]
max_label_length = 40
project_page_size = 10

# How often the service takes one look at each running Codex pane's title, in seconds, and how
# often it drains what the agent hooks have spooled. The title read is the whole of the pane
# watching that remains: it looks for the native approval marker Codex's own hook does not
# report, and it is an inference, described to the owner as one.
activity_poll_seconds = 30

# The size of Claude's context window, in tokens. **This is your statement, not a measurement.**
# Claude Code publishes no context ceiling anywhere this service can read -- a transcript records
# what each turn used and never the window it used it out of, and the model name reads the same
# for the 1M-context variant as for any other. So a session's context percentage can only come
# from a number you state here. If it is wrong, every Claude row shows a confidently wrong
# percentage and nothing else will say so; correct it here. Omit the key entirely and 1000000 is
# assumed. Codex needs no equivalent: it writes its own window into its rollout.
claude_context_window = 1000000
